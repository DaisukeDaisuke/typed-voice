<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チュートリアルを完了してください - typed-voice</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; background: #f6f1ea; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #302a25;
      background: #f6f1ea;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, 100%);
      padding: 28px;
      border: 1px solid #dfd4c8;
      border-radius: 20px;
      background: #fffdf9;
      box-shadow: 0 18px 50px #4b38231f;
    }
    h1 { margin: 0 0 16px; font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.25; }
    p { margin: 12px 0; line-height: 1.75; }
    a {
      display: inline-flex;
      margin-top: 10px;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid #8d421d;
      border-radius: 12px;
      color: #fff;
      background: #9d4d24;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>チュートリアルを完了してください</h1>
    <p>大変申し訳ございません。この端末では、オフライン利用の準備がまだ完了していません。</p>
    <p>インターネットに接続した状態で typed-voice を開き、チュートリアル内の「使い始める」まで完了し、オフラインで使うためのダウンロードをすませてください。</p>
    <p>完了後は、この端末に保存したアプリと音声データを使って、インターネット接続なしでも起動できます。</p>
    <a href="./">再読み込み</a>
  </main>
</body>
</html>
