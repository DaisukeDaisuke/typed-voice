<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>typed-voice 音声エンジン PoC</title>
</head>
<body>
  <main class="poc">
    <h1>音声エンジン PoC</h1>
    <p id="isolation-status" class="status">実行環境を確認しています。</p>
    <label for="voice-manifest">検証対象</label>
    <select id="voice-manifest">
      <option value="voice-manifest.json" selected>つくよみちゃん OmniVoice Full Finetune（変換待ち）</option>
      <option value="omnivoice-reference-manifest.json">OmniVoice 公開ONNX（ランタイム検証用）</option>
    </select>
    <p id="voice-notice" class="notice"></p>
    <div class="controls">
      <button id="prepare-button" type="button">オフライン音声を準備</button>
      <button id="initialize-button" type="button">エンジンを起動</button>
    </div>
    <label for="speech-text">読み上げる文章</label>
    <textarea id="speech-text" rows="5">こんにちは。音声エンジンの動作確認です。</textarea>
    <button id="speak-button" type="button" disabled>読み上げ</button>
    <pre id="engine-status" class="status" aria-live="polite"></pre>
    <section class="license-notice" aria-label="ライセンス表記">
      <p>本ソフトウェアの音声合成には、フリー素材キャラクター「つくよみちゃん」（© Rei Yumesaki）が無料公開している音声データを使用しています。</p>
      <p>■つくよみちゃんコーパス（CV.夢前黎） https://tyc.rei-yumesaki.net/material/corpus/</p>
      <p>Higgs Audio 2 / Meta Llama 3 を利用するランタイムについては、同梱の第三者ライセンスとNOTICEが適用されます。</p>
      <p><a href="./THIRD_PARTY_NOTICES.md">第三者ライセンス・帰属情報</a></p>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
