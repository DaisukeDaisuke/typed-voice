<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>typed-voice 音声エンジン PoC</title>
</head>
<body>
  <main class="poc">
    <h1>音声エンジン PoC</h1>
    <p id="isolation-status" class="status">実行環境を確認しています。</p>
    <div class="controls">
      <button id="prepare-button" type="button">オフライン音声を準備</button>
      <button id="initialize-button" type="button">エンジンを起動</button>
    </div>
    <label for="speech-text">読み上げる文章</label>
    <textarea id="speech-text" rows="5">こんにちは。音声エンジンの動作確認です。</textarea>
    <button id="speak-button" type="button" disabled>読み上げ</button>
    <pre id="engine-status" class="status" aria-live="polite"></pre>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
