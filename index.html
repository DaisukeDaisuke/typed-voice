<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ed">
  <title>typed-voice</title>
</head>
<body>
  <header class="topbar">
    <strong class="brand">typed-voice</strong>
    <nav class="topbar-actions" aria-label="アプリメニュー">
      <button id="history-toggle" class="quiet-button mobile-only" type="button" aria-controls="history-panel" aria-expanded="false">履歴</button>
      <a class="quiet-link" href="./poc.html">音声テスト</a>
      <a class="quiet-link" href="./THIRD_PARTY_NOTICES.md">ライセンス</a>
    </nav>
  </header>

  <main class="app-shell">
    <section id="composer-panel" class="composer-panel" aria-label="入力と統計">
      <div class="section-heading">
        <div>
          <p class="eyebrow">現在の会話</p>
          <h1 id="conversation-title">新しい会話</h1>
        </div>
        <button id="focus-composer" class="quiet-button" type="button">入力する</button>
      </div>

      <div class="stats-grid" aria-label="統計">
        <article><strong id="stat-messages">0</strong><span>メッセージ</span></article>
        <article><strong id="stat-conversations">0</strong><span>会話</span></article>
        <article><strong id="stat-typed">0</strong><span>入力文字</span></article>
        <article><strong id="stat-days">0</strong><span>利用日数</span></article>
      </div>

      <div class="composer-wrap">
        <label for="composer">読み上げる文章</label>
        <textarea id="composer" rows="5" autocomplete="off" enterkeyhint="send" placeholder="ここに入力"></textarea>
        <div class="composer-controls">
          <label class="wait-setting" for="reasoning-seconds">
            <span>読み上げ待ち時間</span>
            <span><input id="reasoning-seconds" type="number" min="0" max="30" step="0.5" value="2"> 秒</span>
          </label>
          <button id="submit-button" class="primary-button" type="button">送信</button>
        </div>
        <p class="keyboard-hint">Enterで送信・Shift+Enterで改行。送信後も入力欄を開いたままにします。</p>
      </div>

      <section class="pending-section" aria-labelledby="pending-heading">
        <div class="section-heading compact">
          <h2 id="pending-heading">読み上げ待ち</h2>
          <span id="pending-count" class="count-badge">0</span>
        </div>
        <div id="pending-list" class="pending-list"></div>
      </section>

      <p id="app-status" class="app-status" aria-live="polite">会話を準備しています。</p>
    </section>

    <section class="timeline-panel" aria-labelledby="timeline-heading">
      <div class="section-heading sticky-heading">
        <div>
          <p class="eyebrow">この会話</p>
          <h2 id="timeline-heading">読み上げ履歴</h2>
        </div>
      </div>
      <div id="message-list" class="message-list"></div>
      <div id="empty-timeline" class="empty-state">
        <strong>まだメッセージはありません</strong>
        <span>左の入力欄から送信すると、ここへ順番に残ります。</span>
      </div>
    </section>

    <aside id="history-panel" class="history-panel" aria-labelledby="history-heading">
      <div class="section-heading sticky-heading history-heading">
        <h2 id="history-heading">履歴</h2>
        <button id="new-conversation" class="primary-button small" type="button">新しい会話</button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
    </aside>
  </main>

  <!-- handled by src/app/ui-orchestrator.js -->
  <template id="conversation-template">
    <button class="conversation-row" type="button">
      <strong class="conversation-preview"></strong>
      <span class="conversation-meta"></span>
    </button>
  </template>

  <!-- handled by src/app/ui-orchestrator.js -->
  <template id="message-template">
    <article class="message-card">
      <p class="message-text"></p>
      <footer><time class="message-time"></time></footer>
    </article>
  </template>

  <!-- handled by src/app/ui-orchestrator.js -->
  <template id="pending-template">
    <article class="pending-card">
      <div class="pending-meta">
        <span class="pending-state">読み上げ待ち</span>
        <span class="pending-timer"></span>
      </div>
      <textarea class="pending-editor" rows="3"></textarea>
      <p class="pending-error" hidden></p>
      <div class="pending-actions">
        <button class="pending-save quiet-button" type="button">修正を反映</button>
        <button class="pending-cancel danger-button" type="button">取り消し</button>
      </div>
    </article>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
